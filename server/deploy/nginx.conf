# Nginx reverse proxy cho QLS server. Đặt tại /etc/nginx/sites-available/qls
# rồi symlink sang sites-enabled. Certbot sẽ tự thêm block TLS.

server {
    server_name license.quangluustudio.com;

    client_max_body_size 600M;   # cho phép upload installer lớn

    # Upstream chết (restart, build, OOM) phải trả JSON, KHÔNG trả HTML.
    # App bản cũ đọc field "status" của body; body không parse được JSON bị coi
    # là "giấy phép không hợp lệ" và máy khách tự xoá license. Vài giây 502 lúc
    # deploy từng đủ để đá hàng loạt máy ra màn hình kích hoạt.
    # Chỉ 502/503/504 bị chặn lại; 401/403/409 của app vẫn đi thẳng ra client.
    proxy_intercept_errors on;
    error_page 502 503 504 = @upstream_down;

    location @upstream_down {
        default_type application/json;
        return 503 '{"valid":false,"status":"server_error","message":"May chu dang bao tri, thu lai sau."}';
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Tải file update — cho stream lớn, bật resume (Range do FastAPI xử lý).
    location /api/v1/updates/download/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_buffering    off;
        proxy_read_timeout 600s;
    }

    listen 80;
    # Sau khi chạy `certbot --nginx`, block 443 + redirect sẽ được thêm tự động.
}

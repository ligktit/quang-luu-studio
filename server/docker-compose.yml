services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qls}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qls}
      POSTGRES_DB: ${POSTGRES_DB:-qls}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qls}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - releases:/data/releases
      # Khoá ký license. Để trong volume riêng để rebuild image không mất khoá,
      # và để backup/rotate tách bạch với dữ liệu khác.
      - keys:/data/keys
    ports:
      - "127.0.0.1:8000:8000"   # chỉ mở local — Nginx ở host proxy ra ngoài

volumes:
  pgdata:
  releases:
  keys:

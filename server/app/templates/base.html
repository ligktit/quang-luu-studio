<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Quang Lưu Studio — Admin{% endblock %}</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --accent:#14b8a6; --text:#e2e8f0; --muted:#94a3b8; --danger:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    a { color: var(--accent); text-decoration:none; }
    header { background:var(--panel); padding:12px 20px; display:flex; gap:18px; align-items:center; border-bottom:1px solid #334155; }
    header .brand { font-weight:700; color:#fff; }
    header nav { display:flex; gap:14px; flex:1; }
    header .right { color:var(--muted); }
    main { padding:24px; max-width:1100px; margin:0 auto; }
    h1 { font-size:20px; }
    table { width:100%; border-collapse:collapse; background:var(--panel); border-radius:8px; overflow:hidden; }
    th, td { padding:10px 12px; text-align:left; border-bottom:1px solid #334155; font-size:14px; }
    th { color:var(--muted); font-weight:600; }
    .card { background:var(--panel); border:1px solid #334155; border-radius:10px; padding:16px; margin-bottom:18px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
    .stat { background:var(--panel); border:1px solid #334155; border-radius:10px; padding:16px; }
    .stat .n { font-size:28px; font-weight:700; color:#fff; }
    .stat .l { color:var(--muted); font-size:13px; }
    input, select, textarea { background:#0b1220; color:var(--text); border:1px solid #334155; border-radius:6px; padding:8px; font-size:14px; }
    label { display:block; font-size:13px; color:var(--muted); margin:6px 0 2px; }
    button { background:var(--accent); color:#04201c; border:none; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; }
    button.danger { background:var(--danger); color:#fff; }
    button.ghost { background:transparent; border:1px solid #334155; color:var(--text); }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
    code { background:#0b1220; padding:2px 6px; border-radius:4px; font-family:ui-monospace,monospace; }
    .badge { padding:2px 8px; border-radius:999px; font-size:12px; }
    .badge.active{background:#064e3b;color:#6ee7b7} .badge.unused{background:#334155;color:#cbd5e1}
    .badge.revoked{background:#7f1d1d;color:#fecaca} .badge.expired{background:#78350f;color:#fed7aa}
    .badge.new{background:#7f1d1d;color:#fecaca} .badge.seen{background:#334155;color:#cbd5e1} .badge.resolved{background:#064e3b;color:#6ee7b7}
    pre { background:#0b1220; padding:14px; border-radius:8px; overflow:auto; font-size:13px; }
  </style>
</head>
<body>
  {% if request.cookies.get('qls_admin') %}
  <header>
    <span class="brand">QLS Admin</span>
    <nav>
      <a href="/admin">Tổng quan</a>
      <a href="/admin/users">Người dùng</a>
      <a href="/admin/licenses">Mã kích hoạt</a>
      <a href="/admin/versions">Phiên bản</a>
      <a href="/admin/crashes">Báo lỗi</a>
    </nav>
    <span class="right">{{ admin }} · <a href="/admin/logout">Đăng xuất</a></span>
  </header>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>

{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:360px;margin:60px auto;">
  <h1>Đăng nhập Admin</h1>
  {% if error %}<p style="color:var(--danger)">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <label>Tài khoản</label>
    <input name="username" autofocus required style="width:100%">
    <label>Mật khẩu</label>
    <input name="password" type="password" required style="width:100%">
    <div style="margin-top:14px"><button type="submit">Đăng nhập</button></div>
  </form>
</div>
{% endblock %}

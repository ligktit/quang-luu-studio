{% extends "base.html" %}
{% block content %}
<h1>Người dùng</h1>
<div class="card">
  <form method="post" action="/admin/users" class="row">
    <div><label>Tên</label><input name="name" required></div>
    <div><label>Email</label><input name="email"></div>
    <div><label>SĐT</label><input name="phone"></div>
    <div><label>Ghi chú</label><input name="note"></div>
    <button type="submit">Thêm</button>
  </form>
</div>
<table>
  <tr><th>ID</th><th>Tên</th><th>Email</th><th>SĐT</th><th>Mã</th><th>Ghi chú</th><th></th></tr>
  {% for u in users %}
  <tr>
    <td>{{ u.id }}</td><td>{{ u.name }}</td><td>{{ u.email or '' }}</td><td>{{ u.phone or '' }}</td>
    <td>{{ u.licenses|length }}</td><td>{{ u.note or '' }}</td>
    <td><form method="post" action="/admin/users/{{ u.id }}/delete" onsubmit="return confirm('Xoá user?')"><button class="danger">Xoá</button></form></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}

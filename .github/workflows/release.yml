name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # v1.4.0, v2.0.0, ...

permissions:
  contents: write   # Cần để tạo GitHub Release

jobs:
  build:
    name: Build installer (Windows)
    runs-on: windows-latest
    # Hai lượt PyInstaller + hai lượt nén lzma2 solid (bản Heavy ~500MB) không
    # kịp trong 60 phút.
    timeout-minutes: 120

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Cần full history để git describe hoạt động

      # ── 2. Python setup ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # ── 3. Install dependencies ────────────────────────────────────────────────
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          # Core deps
          pip install -r requirements.txt
          # Build tools
          pip install pyinstaller

      # ── 4. Verify version matches tag ──────────────────────────────────────────
      - name: Verify version vs tag
        shell: python
        run: |
          import sys, re
          sys.path.insert(0, '.')
          from core.version import __version__
          tag = "${{ github.ref_name }}"          # e.g. v1.4.0
          tag_ver = tag.lstrip('v')
          if __version__ != tag_ver:
              print(f"ERROR: core/version.py has {__version__!r} but tag is {tag!r}")
              sys.exit(1)
          print(f"OK: version {__version__} matches tag {tag}")

      # ── 5. Sync version → .iss ─────────────────────────────────────────────────
      - name: Sync version to .iss
        shell: python
        run: |
          import sys; sys.path.insert(0, '.')
          exec(open('sync_version.py').read())

      # ── 6a. Build exe bản HEAVY (có QtWebEngine) ───────────────────────────────
      # PHẢI build cả hai biến thể. Release chỉ có mỗi bản Light thì
      # core/updater/_version_check.py không tìm ra asset "heavy", rơi xuống
      # nhánh dự phòng `setup_exes[0]` và LẶNG LẼ đẩy mọi khách đang dùng bản
      # Heavy sang bản Light — mất luôn màn hình karaoke nhúng.
      - name: Build executable (Heavy)
        shell: pwsh
        env:
          QLS_WEBENGINE: "1"
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          pyinstaller QuangLuuStudio.spec --noconfirm --distpath dist_heavy
          if (-not (Test-Path "dist_heavy\QuangLuuStudio.exe")) {
            Write-Host "ERROR: No exe found in dist_heavy\"
            Get-ChildItem dist_heavy\
            exit 1
          }
          # Kiểm chứng đây ĐÚNG là bản Heavy: thiếu Qt6WebEngineCore.dll thì cái
          # exe này chỉ là bản Light mang tên Heavy, và khách cài vào sẽ mất
          # màn hình nhúng mà không ai biết cho tới lúc họ báo lỗi.
          $core = Get-ChildItem dist_heavy -Recurse -Filter "Qt6WebEngineCore.dll" -ErrorAction SilentlyContinue
          if (-not $core) {
            Write-Host "ERROR: Ban Heavy thieu Qt6WebEngineCore.dll"
            exit 1
          }
          Write-Host "OK: Heavy build co QtWebEngine"

      # ── 6b. Build exe bản LIGHT (mặc định) ─────────────────────────────────────
      # Xoá build\ giữa hai lượt: PyInstaller dùng lại kết quả Analysis đã cache,
      # không xoá thì bản Light kéo theo luôn QtWebEngine của lượt Heavy.
      - name: Build executable (Light)
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          pyinstaller QuangLuuStudio.spec --noconfirm
          # Rename _2 → production name expected by .iss
          if (Test-Path "dist\QuangLuuStudio_2.exe") {
            Rename-Item "dist\QuangLuuStudio_2.exe" "QuangLuuStudio.exe"
            Write-Host "Renamed dist\QuangLuuStudio_2.exe → dist\QuangLuuStudio.exe"
          } elseif (Test-Path "dist\QuangLuuStudio.exe") {
            Write-Host "dist\QuangLuuStudio.exe already exists"
          } else {
            Write-Host "ERROR: No exe found in dist\"
            Get-ChildItem dist\
            exit 1
          }
          $core = Get-ChildItem dist -Recurse -Filter "Qt6WebEngineCore.dll" -ErrorAction SilentlyContinue
          if ($core) {
            Write-Host "ERROR: Ban Light lai co QtWebEngine (build\ chua duoc xoa?)"
            exit 1
          }
          Write-Host "OK: Light build khong kem QtWebEngine"

      # ── 7. Install Inno Setup ──────────────────────────────────────────────────
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $url  = "https://jrsoftware.org/download.php/is.exe"
          $dest = "$env:TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
          Start-Process $dest -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait
          Write-Host "Inno Setup installed"

      # ── 8. Build installer (cả hai biến thể) ───────────────────────────────────
      - name: Build installers
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          # Heavy: .iss đọc dist_heavy\ và thêm hậu tố _Heavy vào tên file.
          & $iscc /DVariant=heavy QuangLuuStudio_Setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Light: mặc định, đọc dist\.
          & $iscc QuangLuuStudio_Setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Installers built:"
          Get-ChildItem installer_output\
          $exes = @(Get-ChildItem installer_output\*.exe)
          if ($exes.Count -ne 2) {
            Write-Host "ERROR: Can dung 2 file cai (Heavy + Light), tim thay $($exes.Count)"
            exit 1
          }

      # ── 9. (Optional) Code signing ─────────────────────────────────────────────
      # Bỏ comment khi đã có code signing certificate
      # - name: Sign installer
      #   if: secrets.CERT_BASE64 != ''
      #   shell: pwsh
      #   env:
      #     CERT_BASE64: ${{ secrets.CERT_BASE64 }}
      #     CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      #   run: |
      #     $certPath = "$env:TEMP\cert.pfx"
      #     [System.Convert]::FromBase64String($env:CERT_BASE64) | Set-Content $certPath -AsByteStream
      #     $setup = (Get-ChildItem installer_output\*.exe).FullName
      #     signtool sign /f $certPath /p $env:CERT_PASSWORD `
      #       /tr http://timestamp.sectigo.com /td sha256 /fd sha256 $setup
      #     Remove-Item $certPath

      # ── 10. Generate SHA256SUMS.txt ────────────────────────────────────────────
      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $outFile = "installer_output\SHA256SUMS.txt"
          # Heavy đứng TRƯỚC: client bản cũ (trước 1.6.1) chưa biết phân biệt biến
          # thể, nó lấy file .exe đầu tiên trong danh sách.
          $exes = @(Get-ChildItem installer_output\*.exe |
                    Sort-Object { if ($_.Name -match 'Heavy') { 0 } else { 1 } })
          $exes | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -FilePath $outFile -Encoding ascii
          Write-Host "SHA256SUMS.txt:"
          Get-Content $outFile

      # ── 11. Generate release notes from commits ────────────────────────────────
      - name: Generate changelog
        id: changelog
        shell: python
        run: |
          import subprocess, os, re

          # Ghi chú soạn tay thắng danh sách commit tự sinh. Khách đọc release
          # notes là ca sĩ và kỹ thuật viên phòng thu, không phải lập trình
          # viên — 19 dòng "fix(kiosk): ..." không nói cho họ biết bản này có gì.
          current_tag = "${{ github.ref_name }}"
          curated = os.path.join("docs", "release_notes", f"{current_tag}.md")
          if os.path.exists(curated):
              with open(curated, encoding="utf-8") as f:
                  body = f.read().strip()
              with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
                  f.write(body + "\n")
              print(f"Release notes: dung ban soan tay {curated}")
              raise SystemExit(0)

          # Lấy tag trước để so sánh
          result = subprocess.run(
              ["git", "tag", "--sort=-version:refname"],
              capture_output=True, text=True
          )
          tags = [t.strip() for t in result.stdout.splitlines() if t.strip().startswith('v')]
          current_tag = "${{ github.ref_name }}"

          if len(tags) >= 2:
              prev_tag = tags[1]  # Tag ngay trước current
              log_range = f"{prev_tag}..{current_tag}"
          else:
              prev_tag = ""
              log_range = current_tag

          commits = subprocess.run(
              ["git", "log", log_range, "--pretty=format:- %s (%h)"],
              capture_output=True, text=True
          ).stdout.strip()

          body = f"## Thay đổi trong phiên bản {current_tag}\n\n"
          if prev_tag:
              body += f"_(So với {prev_tag})_\n\n"
          body += commits or "- Không có thay đổi ghi chú"

          # Ghi ra file để GitHub Release action đọc
          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(body)
          print("Release notes generated")

      # ── 12. Create GitHub Release ──────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Quang Lưu Studio ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            installer_output/Setup_QuangLuuStudio_Heavy_v*.exe
            installer_output/Setup_QuangLuuStudio_v*.exe
            installer_output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 13. Upload build artifact (backup) ────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.ref_name }}
          path: installer_output/
          retention-days: 30
